name: API CI and Docker

on:
  pull_request:
    branches:
      - main
      - testenv
  push:
    branches:
      - main
      - testenv
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: jbscosoft/binops-sys

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev --no-install-project

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q app tests

      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -p "test_*.py" -v

  docker:
    name: Build and push Docker image
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: jbscosoft
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=api-sha-${{ github.sha }}
            type=ref,event=branch,prefix=api-
            type=semver,pattern={{version}},prefix=api-
            type=semver,pattern={{major}}.{{minor}},prefix=api-
            type=raw,value=api-latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
