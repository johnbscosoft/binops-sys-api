services:
  api:
    image: jbscosoft/binops-sys:${API_IMAGE_TAG:-api-latest}
    container_name: binops-sys-api
    pull_policy: always
    env_file:
      - ${API_ENV_FILE:-./deploy/api.env}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-9001}:8001"
    networks:
      binops_backend:
        aliases:
          - api
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  binops_backend:
    name: binops_backend
    external: true
